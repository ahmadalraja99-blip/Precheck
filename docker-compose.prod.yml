name: precheck-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: migrate
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    restart: "no"
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runtime
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      STORAGE_ROOT: /app/storage
      REPORT_FONT_REGULAR_PATH: /app/fonts/regular.ttf
      REPORT_FONT_BOLD_PATH: /app/fonts/bold.ttf
    volumes:
      - report_storage:/app/storage
      - ./deploy/fonts:/app/fonts:ro
    expose: ["3000"]
    networks: [application, database]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  frontend:
    build:
      context: ../Precheck-Frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose: ["3000"]
    networks: [application]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./deploy/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certbot-webroot:/var/www/certbot:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [application]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  application:
    internal: false
  database:
    internal: true

volumes:
  postgres_data:
  report_storage:
